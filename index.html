<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelimego CMS - Soru Ekleme Paneli</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body
    class="bg-black text-neutral-100 min-h-screen font-sans antialiased relative overflow-x-hidden selection:bg-emerald-900 selection:text-white">

    <div class="max-w-6xl mx-auto px-4 pt-8 pb-2 relative z-10">

        <header
            class="sticky top-0 z-40 bg-black/80 backdrop-blur-md py-4 mb-8 border-b border-neutral-800/80 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-display font-extrabold tracking-tight text-white">
                    Kelimego CMS
                </h1>
                <p class="text-xs text-neutral-400 font-medium tracking-wide uppercase mt-0.5">Soru Yönetim
                    Paneli
                </p>
            </div>

            <div class="flex items-center gap-3">
                <span id="db-status-badge"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-neutral-900 text-neutral-400 border border-neutral-800">
                    <span class="w-2 h-2 rounded-full bg-neutral-600 animate-pulse"></span>
                    Bağlantı Yok
                </span>

                <button type="button" id="export-backup-btn"
                    class="p-2.5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-xl text-neutral-300 hover:text-white text-sm font-medium transition cursor-pointer flex items-center justify-center"
                    title="Verileri Yedekle (JSON)">
                    <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i>
                </button>

                <label id="import-backup-label"
                    class="p-2.5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-xl text-neutral-300 hover:text-white text-sm font-medium transition cursor-pointer flex items-center justify-center"
                    title="Verileri İçe Aktar (JSON)">
                    <i data-lucide="upload" class="w-4 h-4 text-emerald-400"></i>
                    <input type="file" id="import-backup-input" accept=".json,application/json" class="hidden">
                </label>

                <button id="toggle-config-btn"
                    class="px-4 py-2 bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-xl text-neutral-300 hover:text-white text-sm font-medium transition cursor-pointer flex items-center gap-2">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>Firebase Ayarları</span>
                </button>
            </div>
        </header>

        <div id="toast-container"
            class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

        <div id="config-panel" class="hidden mb-8 transition-all duration-300 ease-in-out">
            <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">

                <div class="flex items-center justify-between mb-4 pb-3 border-b border-neutral-800">
                    <div class="flex items-center gap-2">
                        <i data-lucide="key-round" class="w-5 h-5 text-emerald-400"></i>
                        <h3 class="font-display font-semibold text-neutral-200">Firebase Realtime Database
                            Yapılandırması
                        </h3>
                    </div>
                    <button id="close-config-btn"
                        class="text-neutral-400 hover:text-neutral-200 transition cursor-pointer">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <form id="config-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-neutral-400 mb-1.5 uppercase">API Key</label>
                        <input type="password" id="cfg-apiKey" placeholder="AIzaSy..."
                            class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-400 mb-1.5 uppercase">Auth Domain</label>
                        <input type="text" id="cfg-authDomain" placeholder="proje-id.firebaseapp.com"
                            class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-400 mb-1.5 uppercase">Database
                            URL</label>
                        <input type="text" id="cfg-databaseURL"
                            placeholder="https://proje-id-default-rtdb.firebaseio.com"
                            class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-400 mb-1.5 uppercase">Project ID</label>
                        <input type="text" id="cfg-projectId" placeholder="proje-id"
                            class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-400 mb-1.5 uppercase">Storage
                            Bucket</label>
                        <input type="text" id="cfg-storageBucket" placeholder="proje-id.appspot.com"
                            class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-neutral-400 mb-1.5 uppercase">App ID</label>
                        <input type="text" id="cfg-appId" placeholder="1:1234:web:abcd..."
                            class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                    </div>

                    <div class="md:col-span-3 flex justify-end gap-3 mt-2">
                        <button type="button" id="migrate-db-btn"
                            class="px-4 py-2.5 bg-emerald-950/20 hover:bg-emerald-950/40 text-emerald-400 hover:text-emerald-300 border border-emerald-900/30 rounded-xl text-sm font-semibold transition cursor-pointer flex items-center gap-1.5"
                            title="Veritabanındaki tüm eski soruları yeni Map şemasına dönüştürür.">
                            <i data-lucide="database-backup" class="w-4 h-4"></i>
                            Eski Soruları Senkronize Et
                        </button>
                        <button type="button" id="reset-config-btn"
                            class="px-4 py-2.5 bg-neutral-950 hover:bg-red-950/20 hover:text-red-400 border border-neutral-800 hover:border-red-900/40 text-neutral-400 rounded-xl text-sm font-semibold transition cursor-pointer">
                            Sıfırla
                        </button>
                        <button type="submit"
                            class="px-6 py-2.5 bg-white hover:bg-emerald-50 hover:text-emerald-950 text-black rounded-xl text-sm font-semibold shadow-lg shadow-emerald-950/20 transition cursor-pointer flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i>
                            Yapılandırmayı Kaydet
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">

            <section class="lg:col-span-5">
                <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 md:p-8 shadow-2xl relative">

                    <h3 id="form-title"
                        class="text-lg font-display font-bold text-white mb-6 flex items-center gap-2 border-b border-neutral-800 pb-3">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-400"></i>
                        Yeni Soru Ekle
                    </h3>

                    <form id="question-form" class="space-y-6">

                        <div>
                            <label for="category"
                                class="block text-sm font-semibold text-neutral-300 mb-2 flex items-center gap-2">
                                <i data-lucide="layout-grid" class="w-4.5 h-4.5 text-emerald-400"></i>
                                Kategori Seçimi
                            </label>
                            <div class="relative">
                                <select id="category" required
                                    class="w-full px-4 py-3 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm appearance-none cursor-pointer">
                                    <option value="" disabled selected>Kategori seçiniz...</option>
                                </select>
                                <div
                                    class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-neutral-400">
                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                </div>
                            </div>

                            <div class="flex gap-2 mt-2">
                                <input type="text" id="new-category-input"
                                    placeholder="Yeni kategori adı (ör: Bilim)..."
                                    class="flex-1 px-3 py-2 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition placeholder-neutral-600 text-xs">
                                <button type="button" id="add-category-btn"
                                    class="px-3 py-2 bg-emerald-950/20 hover:bg-emerald-950/40 border border-emerald-900/30 text-emerald-400 hover:text-emerald-300 rounded-xl text-xs font-semibold transition cursor-pointer flex items-center gap-1.5 shrink-0">
                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                    Ekle
                                </button>
                            </div>

                            <button type="button" id="toggle-manage-cats-btn"
                                class="mt-2 text-[11px] text-neutral-500 hover:text-neutral-300 transition cursor-pointer flex items-center gap-1">
                                <i data-lucide="settings-2" class="w-3 h-3"></i>
                                <span id="toggle-manage-cats-text">Kategorileri Yönet</span>
                            </button>

                            <div id="category-manage-list-kaldıej"
                                class="hidden mt-2 space-y-1.5 max-h-[180px] overflow-y-auto pr-1">
                            </div>
                        </div>

                        <div>
                            <label for="question"
                                class="block text-sm font-semibold text-neutral-300 mb-2 flex items-center gap-2">
                                <i data-lucide="help-circle" class="w-4.5 h-4.5 text-emerald-400"></i>
                                Soru Girişi
                            </label>
                            <textarea id="question" required rows="4" placeholder="Soruyu buraya yazın..."
                                class="w-full px-4 py-3 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition placeholder-neutral-600 text-sm leading-relaxed resize-y"></textarea>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <label class="block text-sm font-semibold text-neutral-300 flex items-center gap-2">
                                    <i data-lucide="check-square" class="w-4.5 h-4.5 text-emerald-400"></i>
                                    Kabul Edilen Cevaplar
                                </label>
                                <button type="button" id="add-answer-btn"
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-950/20 hover:bg-emerald-950/40 text-emerald-400 hover:text-emerald-300 border border-emerald-900/30 rounded-lg text-xs font-semibold transition cursor-pointer">
                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                    Cevap Ekle
                                </button>
                            </div>

                            <div id="answers-container"
                                class="space-y-3 max-h-[450px] overflow-y-auto overflow-x-hidden pr-1 pb-4">

                            </div>
                        </div>

                        <div class="pt-4 border-t border-neutral-800 flex gap-3" id="form-actions-container">
                            <button type="button" id="cancel-edit-btn"
                                class="hidden flex-1 py-3.5 bg-neutral-950 hover:bg-neutral-850 border border-neutral-800 text-neutral-300 rounded-xl font-bold transition cursor-pointer flex items-center justify-center gap-2">
                                <i data-lucide="x" class="w-5 h-5"></i>
                                <span>İptal</span>
                            </button>
                            <button type="submit" id="submit-btn"
                                class="flex-1 w-full py-3.5 bg-white hover:bg-emerald-50 hover:text-emerald-950 text-black rounded-xl font-bold shadow-lg shadow-emerald-950/20 focus:outline-none focus:ring-2 focus:ring-emerald-800/40 transition cursor-pointer flex items-center justify-center gap-2 group">
                                <i data-lucide="send"
                                    class="w-5 h-5 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-transform duration-250"></i>
                                <span id="submit-btn-text">Soruyu Veritabanına Gönder</span>
                                <div id="submit-spinner"
                                    class="hidden w-5 h-5 border-2 border-black/35 border-t-black rounded-full animate-spin">
                                </div>
                            </button>
                        </div>

                    </form>
                </div>
            </section>

            <section class="lg:col-span-7">
                <div
                    class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 md:p-8 shadow-2xl relative flex flex-col h-full min-h-[550px]">
                    <div class="flex items-center justify-between mb-6 pb-3 border-b border-neutral-800">
                        <div class="flex items-center gap-2.5">
                            <i data-lucide="database" class="w-5 h-5 text-emerald-400"></i>
                            <h3 class="font-display font-bold text-white">Soru Havuzu ve Yönetimi</h3>
                        </div>
                        <div class="flex items-center gap-2">
                            <span id="list-count"
                                class="bg-emerald-950/25 text-emerald-400 border border-emerald-900/30 px-2.5 py-0.5 rounded-full text-xs font-semibold">0
                                soru</span>
                            <button type="button" id="view-all-questions-btn"
                                class="p-1.5 bg-neutral-950 hover:bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-neutral-200 rounded-lg transition cursor-pointer"
                                title="Tüm Soruları Geniş Pencerede Gör">
                                <i data-lucide="maximize-2" class="w-4 h-4"></i>
                            </button>
                            <button type="button" id="toggle-questions-btn"
                                class="p-1.5 bg-neutral-950 hover:bg-neutral-900 border border-neutral-800 text-neutral-400 hover:text-neutral-200 rounded-lg transition cursor-pointer"
                                title="Soruları Gizle/Göster">
                                <i data-lucide="eye" class="w-4 h-4" id="toggle-questions-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="Soru veya cevap ara..."
                                class="w-full pl-10 pr-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                            <div
                                class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-neutral-500">
                                <i data-lucide="search" class="w-4 h-4"></i>
                            </div>
                        </div>
                        <div class="relative">
                            <select id="filter-category"
                                class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm appearance-none cursor-pointer">
                                <option value="all">Tüm Kategoriler</option>
                            </select>
                            <div
                                class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-neutral-400">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>

                    <div id="questions-list-container" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                        <div class="text-center py-20 text-neutral-500 text-sm">
                            <i data-lucide="database" class="w-10 h-10 mx-auto mb-2 opacity-30 animate-pulse"></i>
                            Veritabanı bağlantısı bekleniyor...
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="mt-4 pb-2 flex flex-col items-center gap-1.5">
            <p class="text-xs text-neutral-600">Kelimego CMS • 2026</p>
        </footer>

    </div>

    <div id="view-all-modal" class="fixed inset-0 z-[90] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" id="view-all-backdrop"></div>
        <div class="flex items-center justify-center min-h-screen p-2 md:p-4">
            <div class="relative bg-neutral-900 border border-neutral-800 rounded-3xl shadow-2xl w-full max-w-[96vw] h-[92vh] flex flex-col transform transition-all duration-300 scale-95 opacity-0 overflow-hidden"
                id="view-all-card">

                <div class="flex items-center justify-between px-6 py-5 shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="bg-emerald-950/30 text-emerald-400 border border-emerald-900/40 p-2 rounded-xl">
                            <i data-lucide="database" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-display font-extrabold text-white text-lg">Tüm Sorular</h3>
                            <p class="text-xs text-neutral-400 mt-0.5">Soru havuzundaki tüm soruları görüntüleyin,
                                arayın ve yönetin.</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <span id="view-all-count"
                            class="bg-emerald-950/25 text-emerald-400 border border-emerald-900/30 px-3 py-1 rounded-full text-xs font-semibold">0
                            soru</span>
                        <button type="button" id="view-all-close-btn"
                            class="p-2 hover:bg-neutral-800 border border-neutral-800 text-neutral-400 hover:text-white rounded-xl transition cursor-pointer">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div
                    class="grid grid-cols-1 md:grid-cols-3 gap-4 p-6 border-b border-neutral-850 shrink-0 bg-neutral-950/20">
                    <div class="relative">
                        <input type="text" id="view-all-search-question" placeholder="Soru metninde ara..."
                            class="w-full pl-10 pr-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                        <div
                            class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-neutral-500">
                            <i data-lucide="help-circle" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <div class="relative">
                        <input type="text" id="view-all-search-answer" placeholder="Cevaplarda ara..."
                            class="w-full pl-10 pr-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm">
                        <div
                            class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-neutral-500">
                            <i data-lucide="check-square" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <div class="relative">
                        <select id="view-all-filter-category"
                            class="w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm appearance-none cursor-pointer">
                            <option value="all">Tüm Kategoriler</option>
                        </select>
                        <div
                            class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-neutral-400">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto p-6">
                    <div id="view-all-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="app-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" id="modal-backdrop"></div>
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="relative bg-neutral-900 border border-neutral-800 rounded-2xl shadow-2xl w-full max-w-sm p-6 transform transition-all duration-200 scale-95 opacity-0"
                id="modal-card">
                <p id="modal-message" class="text-sm text-neutral-200 leading-relaxed mb-5"></p>
                <input type="text" id="modal-input"
                    class="hidden w-full px-4 py-2.5 bg-black border border-neutral-800 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-emerald-800/40 focus:border-emerald-700 transition text-sm mb-5">
                <div class="flex justify-end gap-2">
                    <button type="button" id="modal-cancel-btn"
                        class="px-4 py-2 bg-neutral-950 hover:bg-neutral-800 border border-neutral-800 text-neutral-400 hover:text-neutral-200 rounded-xl text-sm font-semibold transition cursor-pointer">
                        İptal
                    </button>
                    <button type="button" id="modal-confirm-btn"
                        class="px-4 py-2 bg-white hover:bg-emerald-50 hover:text-emerald-950 text-black rounded-xl text-sm font-bold shadow-lg shadow-emerald-950/10 transition cursor-pointer">
                        Onayla
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
